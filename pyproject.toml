[project]
name = "dependency-checker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["rich", "typer"]

[project.scripts]
deps-check = "dependency_checker.main:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
